name: Build & Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Windows NSIS Installer
        run: tauri build --bundles nsis

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zad-english-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    name: Build Linux (.deb & .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Linux Bundles
        run: tauri build --bundles deb,appimage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zad-english-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build macOS DMG
        run: tauri build --bundles dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zad-english-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg

  publish-release:
    name: Create & Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate files for release
        id: files
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) -exec cp {} release-files/ \;
          echo "Files to release:"
          ls -lh release-files/

      - name: Compute Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Zad English ${{ steps.tag_info.outputs.tag }}
          body: |
            ## 🌟 Zad English — زاد الإنجليزية (الإصدار ${{ steps.tag_info.outputs.tag }})

            تطبيق سطح مكتب مجاني ومفتوح المصدر لتعلم وإتقان مفردات اللغة الإنجليزية من أكسفورد (Oxford 5000) مع النطق البشري المزدوج (أمريكي 🇺🇸 وبريطاني 🇬🇧) والترجمة العربية الدقيقة.

            ### 📦 روابط التحميل المباشرة حسب نظام التشغيل:
            - 🪟 **ويندوز (Windows 10 / 11):** حمل ملف التثبيت المباشر `Zad English_*_x64-setup.exe`.
            - 🐧 **لينكس (Linux):** حمل حزمة `.deb` لأنظمة Debian/Ubuntu أو ملف `.AppImage` الذي يعمل مباشرة على جميع توزيعات لينكس.
            - 🍎 **ماك (macOS):** حمل صورة القرص `.dmg`.

            ### 🚀 الميزات الرئيسية:
            - **6,207 كلمة منتقاة** تغطي كافة مستويات الإطار الأوروبي المشترك (A1, A2, B1, B2, C1, C2).
            - **ترجمة عربية دقيقة** بحسب نوع الكلمة النحوي (اسم، فعل، صفة، ظرف).
            - **أمثلة سياقية مترجمة بالكامل للعربية**.
            - **رمز صوتي عالمي دقيق (IPA)** لكل من اللهجة الأمريكية والبريطانية.
            - **نظام كويزات ذكية واختبارات دورية** لترسيخ المفردات.
            - **ويدجت عائم خفيف وجميل** بتصميم زجاجي مع دعم كامل للوضع الداكن والفاتح ومواقع متعددة على الشاشة.
          files: release-files/*
          draft: false
          prerelease: false
