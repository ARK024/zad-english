<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https: data: blob:; media-src 'self' https: data: blob:; connect-src 'self' https: data: blob:;">
  <title>Zad English — Floating Word Widget</title>
  <link rel="stylesheet" href="styles/widget.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="shell" id="shell">
    <!-- Header Bar -->
    <header class="hdr" data-tauri-drag-region>
      <div class="hdr-l" data-tauri-drag-region>
        <div class="brand-pill" data-tauri-drag-region>
          <span class="brand-dot"></span>
          <span class="brand-name">ZAD</span>
        </div>
        <span class="badge-level level-B1" id="levelBadge">B1</span>
      </div>

      <div class="hdr-center" data-tauri-drag-region>
        <div class="drag-handle" data-tauri-drag-region></div>
      </div>

      <div class="hdr-r">
        <button class="hdr-btn" id="btnSettings" title="الإعدادات والمعجم الشامل (Ctrl+,)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="hdr-btn cls" id="btnClose" title="إخفاء مؤقت (Esc)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </header>

    <!-- Top Progress Bar -->
    <div class="prog-track">
      <div class="prog-fill" id="progFill" style="width: 0%"></div>
    </div>

    <!-- Main Word Container -->
    <main class="content" id="contentArea">
      <!-- Word & POS Row -->
      <div class="word-hero">
        <h1 class="word-title" id="wordTitle">...</h1>
        <span class="word-pos" id="wordPos">pos</span>
      </div>

      <!-- Human Pronunciation Dual Chips -->
      <div class="phonetics-row">
        <!-- US Chip -->
        <button class="audio-chip" id="chipUs" title="استمع لنطق المتحدث الأمريكي الأصلي (US Studio Audio)">
          <span class="flag">🇺🇸</span>
          <span class="dialect-lbl">US</span>
          <span class="ipa" id="wordPhoneticUs">/.../</span>
          <span class="wave-icon">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
          </span>
        </button>

        <!-- UK Chip -->
        <button class="audio-chip" id="chipUk" title="استمع لنطق المتحدث البريطاني الأصلي (UK Studio Audio)">
          <span class="flag">🇬🇧</span>
          <span class="dialect-lbl">UK</span>
          <span class="ipa" id="wordPhoneticUk">/.../</span>
          <span class="wave-icon">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
          </span>
        </button>
      </div>

      <!-- Meaning Section -->
      <section class="card-meaning">
        <div class="ar-meaning" id="arabicMeaning">جاري التحميل...</div>
        <div class="en-def" id="englishDef">English definition</div>
      </section>

      <!-- Real-world Example Card -->
      <section class="card-example">
        <div class="example-quote-mark">“</div>
        <div class="example-body">
          <p class="example-en" id="exampleEn">Example sentence</p>
          <p class="example-ar" id="exampleAr">الترجمة العربية للمثال</p>
        </div>
      </section>

      <!-- Synonyms Tags -->
      <div class="synonyms-bar" id="synonymsRow" style="display: none;">
        <span class="syn-title">مرادفات:</span>
        <div class="syn-list" id="synonymsList"></div>
      </div>
    </main>

    <!-- Footer Controls -->
    <footer class="ftr">
      <div class="nav-cluster">
        <button class="nav-arrow-btn" id="btnPrev" title="الكلمة السابقة (السهم الأيسر)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="counter-display" id="counterTag">0 / 0</span>
        <button class="nav-arrow-btn" id="btnNext" title="الكلمة التالية (السهم الأيمن أو مسافة)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <div class="action-cluster">
        <button class="act-btn btn-quiz" id="btnQuiz" title="اختبر حفظك للكلمات">
          <span>🎯</span>
          <span>اختبار</span>
        </button>
        <button class="act-btn btn-rev" id="btnReview" title="إضافة لقائمة المراجعة">
          <span class="icon">🔄</span>
          <span class="txt">مراجعة</span>
        </button>
        <button class="act-btn btn-mem" id="btnMemorized" title="تحديد كـ محفوظة">
          <span class="icon">✓</span>
          <span class="txt">حفظتها</span>
        </button>
      </div>
    </footer>
  </div>

  <script src="tauri-shim.js"></script>
  <script src="widget.js"></script>
</body>
</html>
