[package]
name = "zad-english"
version = "1.0.1"
description = "زاد الإنجليزية - رفيقك اليومي لتعلم وممارسة مفردات أكسفورد"
authors = ["Zad English Team"]
edition = "2021"
default-run = "zad-english"
rust-version = "1.77"

[lib]
name = "zad_english_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
rand = "0.8"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
